[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "homewatch"
version = "0.2.0"
description = "Home counter-surveillance detector for Linux: Remote ID drones, Bluetooth trackers, unknown devices, RF."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ryan Davis" }]
dependencies = ["bleak>=0.21"]
classifiers = [
  "Operating System :: POSIX :: Linux",
  "Environment :: Console",
  "Topic :: System :: Networking :: Monitoring",
]

[project.urls]
Homepage = "https://github.com/sloppytopp/homewatch"
Issues = "https://github.com/sloppytopp/homewatch/issues"

[project.scripts]
homewatch = "homewatch.cli:main"

[tool.setuptools]
packages = ["homewatch"]
