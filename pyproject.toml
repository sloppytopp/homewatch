[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "n0rma-sec"
version = "0.4.1"
description = "Home counter-surveillance detector for Linux: Remote ID drones, Bluetooth trackers, unknown devices, RF."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ryan Davis" }]
dependencies = ["bleak>=0.21"]
classifiers = [
  "Operating System :: POSIX :: Linux",
  "Environment :: Console",
  "Topic :: System :: Networking :: Monitoring",
]

[project.urls]
Homepage = "https://github.com/sloppytopp/n0rma"
Issues = "https://github.com/sloppytopp/n0rma/issues"

[project.scripts]
n0rma = "n0rma.cli:main"
homewatch = "n0rma.cli:legacy"   # old name, kept so existing installs keep working

[tool.setuptools]
packages = ["n0rma"]
